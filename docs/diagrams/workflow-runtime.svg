y="230" width="285" height="76" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="732" y="230" width="5" height="76" rx="2" fill="#2563eb"/><text x="752" y="262" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">准备材料</text><text x="752" y="289" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">prepare_materials</text><path d="M689,268 L732,268" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="1060" y="230" width="285" height="76" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="1060" y="230" width="5" height="76" rx="2" fill="#2563eb"/><text x="1080" y="262" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">加载执行计划</text><text x="1080" y="289" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">load_evaluation</text><path d="M1017,268 L1060,268" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="76" y="344" width="285" height="76" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="76" y="344" width="5" height="76" rx="2" fill="#2563eb"/><text x="96" y="376" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">执行规则</text><text x="96" y="403" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">execute_rules</text><rect x="404" y="344" width="285" height="76" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="404" y="344" width="5" height="76" rx="2" fill="#2563eb"/><text x="424" y="376" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">汇总批次</text><text x="424" y="403" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">finalize_node_execution</text><path d="M361,382 L404,382" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="732" y="344" width="285" height="76" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="732" y="344" width="5" height="76" rx="2" fill="#2563eb"/><text x="752" y="376" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">推进任务状态</text><text x="752" y="403" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">advance_workflow</text><path d="M689,382 L732,382" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="1060" y="344" width="285" height="76" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="1060" y="344" width="5" height="76" rx="2" fill="#2563eb"/><text x="1080" y="376" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">保存任务结果</text><text x="1080" y="403" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">save_node_result</text><path d="M1017,382 L1060,382" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1345,268 L1372,268 L1372,322 L61,322 L61,382 L76,382" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="48" y="475" width="1344" height="355" rx="12" fill="#f7f9fc"/><text x="68" y="505" font-size="16" fill="#0f766e" font-weight="600" text-anchor="start">execute_rules 内部 · 按依赖串行调度</text><rect x="85" y="550" width="270" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="85" y="550" width="5" height="88" rx="2" fill="#0f766e"/><text x="105" y="582" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">读取一条规则</text><text x="105" y="609" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">RuleExecutionState · 独立上下文</text><rect x="440" y="550" width="270" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="440" y="550" width="5" height="88" rx="2" fill="#0f766e"/><text x="460" y="582" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">调用模型</text><text x="460" y="609" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">读取配置和当前数据</text><rect x="795" y="550" width="270" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="795" y="550" width="5" height="88" rx="2" fill="#0f766e"/><text x="815" y="582" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">校验候选结论</text><text x="815" y="609" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">不合格时按现有协议继续循环</text><rect x="1110" y="550" width="245" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="1110" y="550" width="5" height="88" rx="2" fill="#0f766e"/><text x="1130" y="582" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">提交本条结果</text><text x="1130" y="609" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">再调度下一条规则</text><rect x="440" y="710" width="270" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="440" y="710" width="5" height="88" rx="2" fill="#7c3aed"/><text x="460" y="742" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">执行工具调用</text><text x="460" y="769" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">真实工具结果回传模型</text><path d="M355,594 L440,594" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><path d="M710,594 L795,594" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="716.0" y="564" width="72" height="23" rx="5" fill="white"/><text x="752" y="580" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">返回结论</text><path d="M1065,594 L1110,594" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><path d="M575,638 L575,710" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="539.0" y="661" width="72" height="23" rx="5" fill="white"/><text x="575" y="677" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">需要工具</text><path d="M440,754 L399,754 L399,618 L440,618" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="376.0" y="673" width="44" height="23" rx="5" fill="white"/><text x="398" y="689" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">回传</text><path d="M930,550 L930,526 L575,526 L575,550" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="714.0" y="505" width="72" height="23" rx="5" fill="white"/><text x="750" y="521" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">需要纠正</text><text x="85" y="716" font-size="15" fill="#0f766e" font-weight="400" text-anchor="start">组合汇总：程序直接计算并保存。</text><text x="85" y="748" font-size="15" fill="#b45309" font-weight="400" text-anchor="start">材料受阻：记录原因并保存。</text><text x="48" y="889" font-size="18" fill="#2563eb" font-weight="600" text-anchor="start">状态与恢复</text><text x="48" y="917" font-size="15" fill="#5d6c80" font-weight="400" text-anchor="start">图状态仅在本次运行内保存，没有持久化 checkpoint；继续执行依据数据库中的执行批次、已提交结果与字段确认。</text><text x="48" y="958" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">任务图建立执行失败时转 save_node_result；其他异常由调用边界显式处理。单条模型循环不增加任务图节点数。</text></g></svg>