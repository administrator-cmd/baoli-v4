<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img"><title>ER 总览：配置、执行与材料</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5d6c80"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="42" font-size="13" fill="#2563eb" font-weight="600" text-anchor="start">DATA MODEL / 00</text><text x="48" y="91" font-size="32" fill="#15253c" font-weight="600" text-anchor="start">ER 总览：配置、执行与材料</text><text x="48" y="125" font-size="16" fill="#5d6c80" font-weight="400" text-anchor="start">主干关系只保留核心实体；完整 25 张表与 36 组外键在各模块明细中。</text><line x1="48" y1="871" x2="1392" y2="871" stroke="#e2e8f0"/><text x="48" y="897" font-size="12" fill="#5d6c80" font-weight="400" text-anchor="start">BAOLI · 资料审核系统   /   基于当前源码 · 2026-11-16</text><rect x="48" y="165" width="404" height="650" rx="12" fill="#f7f9fc"/><text x="68" y="195" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">01  配置快照</text><rect x="518" y="165" width="404" height="650" rx="12" fill="#f7f9fc"/><text x="538" y="195" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">02  审核执行</text><rect x="988" y="165" width="404" height="650" rx="12" fill="#f7f9fc"/><text x="1008" y="195" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">03  材料版本</text><rect x="85" y="235" width="330" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="85" y="235" width="5" height="88" rx="2" fill="#2563eb"/><text x="105" y="267" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">场景</text><text x="105" y="294" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">scenario_template</text><rect x="85" y="420" width="330" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="85" y="420" width="5" height="88" rx="2" fill="#2563eb"/><text x="105" y="452" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">已发布场景版本</text><text x="105" y="479" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">scenario_version</text><rect x="85" y="605" width="330" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="85" y="605" width="5" height="88" rx="2" fill="#2563eb"/><text x="105" y="637" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">审核方案</text><text x="105" y="664" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">audit_plan</text><rect x="555" y="235" width="330" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="555" y="235" width="5" height="88" rx="2" fill="#0f766e"/><text x="575" y="267" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">审核任务</text><text x="575" y="294" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">audit_task</text><rect x="555" y="420" width="330" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="555" y="420" width="5" height="88" rx="2" fill="#0f766e"/><text x="575" y="452" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">执行批次</text><text x="575" y="479" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">node_execution</text><rect x="555" y="605" width="330" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="555" y="605" width="5" height="88" rx="2" fill="#0f766e"/><text x="575" y="637" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">规则执行结果</text><text x="575" y="664" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">rule_result</text><rect x="1025" y="235" width="330" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="1025" y="235" width="5" height="88" rx="2" fill="#b45309"/><text x="1045" y="267" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">任务材料位</text><text x="1045" y="294" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">task_document</text><rect x="1025" y="420" width="330" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="1025" y="420" width="5" height="88" rx="2" fill="#b45309"/><text x="1045" y="452" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">上传文件版本</text><text x="1045" y="479" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">document_upload</text><rect x="1025" y="605" width="330" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="1025" y="605" width="5" height="88" rx="2" fill="#b45309"/><text x="1045" y="637" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">处理产物</text><text x="1045" y="664" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">stored_artifact</text><path d="M250,323 L250,420" fill="none" stroke="#5d6c80" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="180.0" y="358" width="140" height="23" rx="5" fill="white"/><text x="250" y="374" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">编号快照 · 无 FK</text><path d="M250,508 L250,605" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="195.0" y="541" width="110" height="23" rx="5" fill="white"/><text x="250" y="557" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">0..1 → 0..N</text><path d="M415,649 L477,649 L477,279 L555,279" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="441.0" y="445" width="72" height="23" rx="5" fill="white"/><text x="477" y="461" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">方案来源</text><path d="M720,323 L720,420" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="677.0" y="358" width="86" height="23" rx="5" fill="white"/><text x="720" y="374" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">1 → 0..N</text><path d="M720,508 L720,605" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="677.0" y="541" width="86" height="2