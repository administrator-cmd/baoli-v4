<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>后台操作与报告模板</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5d6c80"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="42" font-size="13" fill="#2563eb" font-weight="600" text-anchor="start">DATA MODEL / LOGICAL REFERENCES</text><text x="48" y="91" font-size="32" fill="#15253c" font-weight="600" text-anchor="start">后台操作与报告模板</text><text x="48" y="125" font-size="16" fill="#5d6c80" font-weight="400" text-anchor="start">这两类关联通过业务编号或配置快照实现，不属于物理外键。</text><line x1="48" y1="851" x2="1392" y2="851" stroke="#e2e8f0"/><text x="48" y="877" font-size="12" fill="#5d6c80" font-weight="400" text-anchor="start">BAOLI · 资料审核系统   /   基于当前源码 · 2026-11-16</text><rect x="48" y="170" width="650" height="580" rx="12" fill="#f7f9fc"/><text x="68" y="200" font-size="16" fill="#7c3aed" font-weight="600" text-anchor="start">后台操作及业务记录</text><rect x="730" y="170" width="662" height="580" rx="12" fill="#f7f9fc"/><text x="750" y="200" font-size="16" fill="#0f766e" font-weight="600" text-anchor="start">报告风格的冻结使用</text><rect x="90" y="250" width="270" height="108" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="90" y="250" width="5" height="108" rx="2" fill="#7c3aed"/><text x="110" y="282" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">后台操作</text><text x="110" y="309" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">background_operation</text><text x="110" y="331" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">operation_no / status</text><rect x="390" y="480" width="270" height="108" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="390" y="480" width="5" height="108" rx="2" fill="#7c3aed"/><text x="410" y="512" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">操作日志</text><text x="410" y="539" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">operation_log</text><text x="410" y="561" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">command_no / result</text><path d="M225,358 L225,534 L390,534" fill="none" stroke="#5d6c80" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="145.0" y="415" width="160" height="23" rx="5" fill="white"/><text x="225" y="431" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">command_no 逻辑引用</text><text x="90" y="660" font-size="18" fill="#7c3aed" font-weight="600" text-anchor="start">对象定位</text><text x="90" y="688" font-size="15" fill="#5d6c80" font-weight="400" text-anchor="start">两表以 object_type + object_no 关联业务对象。</text><rect x="780" y="250" width="550" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="780" y="250" width="5" height="88" rx="2" fill="#0f766e"/><text x="800" y="282" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">报告模板</text><text x="800" y="309" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">report_template · template_no / style_profile_json</text><rect x="780" y="480" width="550" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="780" y="480" width="5" height="88" rx="2" fill="#0f766e"/><text x="800" y="512" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">任务配置快照</text><text x="800" y="539" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">audit_task.manifest_json.report_generation</text><path d="M1055,338 L1055,480" fill="none" stroke="#5d6c80" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="928.0" y="391" width="254" height="23" rx="5" fill="white"/><text x="1055" y="407" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">创建任务时冻结模板编号、名称和风格</text><text x="780" y="660" font-size="18" fill="#0f766e" font-weight="600" text-anchor="start">模板后续修改</text><text x="780" y="688" font-size="15" fill="#5d6c80" font-weight="400" text-anchor="start">已经创建的任务继续使用自身冻结的风格档案。</text><text x="48" y="806" font-size="15" fill="#5d6c80" font-weight="400" text-anchor="start">本页虚线均为逻辑引用或复制，不表示数据库 FK。后台操作与 AI 编制的真实外键见「AI 规则库编制」。</text></g></svg>