<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="990" viewBox="0 0 1440 990" role="img"><title>业务工作流：从规则库到审核报告</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5d6c80"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="42" font-size="13" fill="#2563eb" font-weight="600" text-anchor="start">WORKFLOW / BUSINESS</text><text x="48" y="91" font-size="32" fill="#15253c" font-weight="600" text-anchor="start">业务工作流：从规则库到审核报告</text><text x="48" y="125" font-size="16" fill="#5d6c80" font-weight="400" text-anchor="start">上半部分负责配置发布，下半部分负责每一次资料审核。</text><line x1="48" y1="941" x2="1392" y2="941" stroke="#e2e8f0"/><text x="48" y="967" font-size="12" fill="#5d6c80" font-weight="400" text-anchor="start">BAOLI · 资料审核系统   /   基于当前源码 · 2026-11-16</text><rect x="48" y="170" width="1344" height="200" rx="12" fill="#f7f9fc"/><text x="68" y="200" font-size="16" fill="#7c3aed" font-weight="600" text-anchor="start">01 规则库准备 · 管理员</text><rect x="85" y="240" width="300" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="85" y="240" width="5" height="88" rx="2" fill="#7c3aed"/><text x="105" y="272" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">业务 Excel</text><text x="105" y="299" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">直接导入，或先 AI 编制</text><rect x="415" y="240" width="300" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="415" y="240" width="5" height="88" rx="2" fill="#7c3aed"/><text x="435" y="272" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">AI 辅助编制（可选）</text><text x="435" y="299" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">整理 → 复核 → 修改 → 冻结导出</text><rect x="1005" y="240" width="300" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="1005" y="240" width="5" height="88" rx="2" fill="#7c3aed"/><text x="1025" y="272" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">导入解析</text><text x="1025" y="299" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">LLM 转换系统执行配置</text><path d="M385,284 L415,284" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><path d="M715,284 L1005,284" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="775.0" y="255" width="170" height="23" rx="5" fill="white"/><text x="860" y="271" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">选择场景后创建导入作业</text><path d="M235,240 L235,218 L1155,218 L1155,240" fill="none" stroke="#5d6c80" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="722.0" y="198" width="156" height="23" rx="5" fill="white"/><text x="800" y="214" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">原 Excel 可直接导入</text><rect x="48" y="400" width="1344" height="200" rx="12" fill="#f7f9fc"/><text x="68" y="430" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">02 配置发布 · 管理员 → 使用者</text><rect x="85" y="470" width="300" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="85" y="470" width="5" height="88" rx="2" fill="#2563eb"/><text x="105" y="502" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">检查解析结果</text><text x="105" y="529" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">修改并保存场景草稿</text><rect x="525" y="470" width="300" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="525" y="470" width="5" height="88" rx="2" fill="#2563eb"/><text x="545" y="502" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">发布场景版本</text><text x="545" y="529" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">形成不可变配置快照</text><rect x="1005" y="470" width="300" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="1005" y="470" width="5" height="88" rx="2" fill="#2563eb"/><text x="1025" y="502" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">创建审核方案</text><text x="1025" y="529" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">按需调整生效规则与配置</text><path d="M1155,328 L1155,385 L460,385 L460,450 L235,450 L235,470" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><path d="M385,514 L525,514" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="433.0" y="486" width="44" height="23" rx="5" fill="white"/><text x="455" y="502" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">发布</text><path d="M825,514 L1005,514" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="879.0" y="486" width="72" height="23" rx="5" fill="white"/><text x="915" y="502" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">基于版本</text><rect x="48" y="630" width="1344" height="200" rx="12" fill="#f7f9fc"/><text x="68" y="660" font-size="16" fill="#0f766e" font-weight="600" text-anchor="start">03 资料审核 · 使用者</text><rect x="85" y="700" width="300" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="85" y="700" width="5" height="88" rx="2" fill="#0f766e"/><text x="105" y="732" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">创建任务并上传资料</text><text x="105" y="759" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">冻结方案；上传保存原件</text><rect x="525" y="700" width="300" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="525" y="700" width="5" height="88" rx="2" fill="#0f766e"/><text x="545" y="732" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">执行审核与字段核对</text><text x="545" y="759" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">材料处理 → 抽取 → 确认 → 规则</text><rect x="1005" y="700" width="300" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="1005" y="700" width="5" height="88" rx="2" fill="#0f766e"/><text x="1025" y="732" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">查看风险与审核报告</text><text x="1025" y="759" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">执行状态与业务结论分别展示</text><path d="M1155,558 L1155,615 L460,615 L460,680 L235,680 L235,700" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><path d="M385,744 L525,744" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="419.0" y="716" width="72" height="23" rx="5" fill="white"/><text x="455" y="732" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">开始审核</text><path d="M825,744 L1005,744" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="879.0" y="716" width="72" height="23" rx="5" fill="white"/><text x="915" y="732" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">结果保存</text><text x="48" y="877" font-size="18" fill="#2563eb" font-weight="600" text-anchor="start">配置冻结</text><text x="48" y="905" font-size="15" fill="#5d6c80" font-weight="400" text-anchor="start">场景、方案后续修改，不影响已经创建的任务；AI 编制导出不会自动发布场景或创建任务。</text></g></svg>