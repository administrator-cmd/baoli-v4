<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img"><title>审核工作流：材料准备 → 字段核对 → 规则执行</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5d6c80"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="42" font-size="13" fill="#2563eb" font-weight="600" text-anchor="start">WORKFLOW / AUDIT</text><text x="48" y="91" font-size="32" fill="#15253c" font-weight="600" text-anchor="start">审核工作流：材料准备 → 字段核对 → 规则执行</text><text x="48" y="125" font-size="16" fill="#5d6c80" font-weight="400" text-anchor="start">实线为业务执行路径；蓝色分支表示条件选择，橙色表示人工等待。</text><line x1="48" y1="1111" x2="1392" y2="1111" stroke="#e2e8f0"/><text x="48" y="1137" font-size="12" fill="#5d6c80" font-weight="400" text-anchor="start">BAOLI · 资料审核系统   /   基于当前源码 · 2026-11-16</text><rect x="48" y="168" width="1344" height="277" rx="12" fill="#f7f9fc"/><text x="68" y="198" font-size="16" fill="#0f766e" font-weight="600" text-anchor="start">01 材料准备</text><rect x="75" y="245" width="225" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="75" y="245" width="5" height="88" rx="2" fill="#0f766e"/><text x="95" y="277" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">开始审核</text><text x="95" y="304" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">读取冻结配置</text><rect x="350" y="245" width="270" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="350" y="245" width="5" height="88" rx="2" fill="#0f766e"/><text x="370" y="277" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">原文件质量检查</text><text x="370" y="304" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">依据生效规则逐文件判断</text><rect x="690" y="245" width="250" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="690" y="245" width="5" height="88" rx="2" fill="#0f766e"/><text x="710" y="277" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">材料类型校验</text><text x="710" y="304" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">8018 · 获准文件进入处理</text><rect x="1020" y="212" width="300" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="1020" y="212" width="5" height="88" rx="2" fill="#0f766e"/><text x="1040" y="244" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">去章 → OCR</text><text x="1040" y="271" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">8010 → PaddleOCR</text><rect x="1020" y="340" width="300" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="1020" y="340" width="5" height="88" rx="2" fill="#0f766e"/><text x="1040" y="372" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">原件印章识别</text><text x="1040" y="399" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">8003 · 与去章分支并行</text><path d="M300,289 L350,289" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><path d="M620,289 L690,289" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><path d="M940,289 L980,289 L980,256 L1020,256" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><path d="M980,289 L980,384 L1020,384" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><text x="350" y="380" font-size="15" fill="#b45309" font-weight="400" text-anchor="start">质量不通过 / 无法判定：停止该文件后续处理，</text><text x="350" y="407" font-size="15" fill="#b45309" font-weight="400" text-anchor="start">关联规则记录原因，无关材料继续。</text><rect x="48" y="478" width="1344" height="276" rx="12" fill="#f7f9fc"/><text x="68" y="508" font-size="16" fill="#b45309" font-weight="600" text-anchor="start">02 抽取与人工核对</text><rect x="75" y="557" width="240" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="75" y="557" width="5" height="88" rx="2" fill="#2563eb"/><text x="95" y="589" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">按依赖生成执行计划</text><text x="95" y="616" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">只有存在抽取项才需要核对</text><rect x="380" y="557" width="240" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="380" y="557" width="5" height="88" rx="2" fill="#0f766e"/><text x="400" y="589" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">执行抽取规则</text><text x="400" y="616" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">相邻同来源字段可合并抽取</text><rect x="690" y="557" width="260" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="690" y="557" width="5" height="88" rx="2" fill="#b45309"/><text x="710" y="589" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">等待字段核对</text><text x="710" y="616" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">WAITING_FIELD_REVIEW</text><rect x="1030" y="557" width="290" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="1030" y="557" width="5" height="88" rx="2" fill="#b45309"/><text x="1050" y="589" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">确认并继续</text><text x="1050" y="616" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">保存修正并绑定输入版本</text><path d="M1320,256 L1365,256 L1365,460 L330,460 L330,535 L195,535 L195,557" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1320,384 L1365,384" fill="none" stroke="#5d6c80" stroke-width="1.8"/><path d="M315,601 L380,601" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="318.0" y="570" width="58" height="23" rx="5" fill="white"/><text x="347" y="586" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">有抽取</text><path d="M620,601 L690,601" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><path d="M950,601 L1030,601" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><text x="690" y="700" font-size="15" fill="#b45309" font-weight="400" text-anchor="start">仅保存修改：仍留在等待点。</text><text x="1030" y="700" font-size="15" fill="#b45309" font-weight="400" text-anchor="start">确认后沿用同一执行批次。</text><rect x="48" y="789" width="1344" height="244" rx="12" fill="#f7f9fc"/><text x="68" y="819" font-size="16" fill="#0f766e" font-weight="600" text-anchor="start">03 核对后审核与收尾</text><rect x="380" y="860" width="310" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="380" y="860" width="5" height="88" rx="2" fill="#0f766e"/><text x="400" y="892" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">计算 / 检查 / 风险 / 报告</text><text x="400" y="919" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">按依赖执行，报告按生效规则生成</text><rect x="810" y="860" width="250" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="810" y="860" width="5" height="88" rx="2" fill="#0f766e"/><text x="830" y="892" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">保存与汇总结果</text><text x="830" y="919" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">每条规则独立保存结局</text><rect x="1120" y="860" width="235" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="1120" y="860" width="5" height="88" rx="2" fill="#2563eb"/><text x="1140" y="892" font-size="20" fill="#15253c" font-weight="600" text-anchor="start">形成任务状态</text><text x="1140" y="919" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="start">完成 / 阻断 / 失败</text><path d="M195,645 L195,735 L270,735 L270,904 L380,904" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/><rect x="234.0" y="759" width="72" height="23" rx="5" fill="white"/><text x="270" y="775" font-size="14" fill="#2563eb" font-weight="400" text-anchor="middle">无抽取项</text><path d="M1175,645 L1175,665 L1365,665 L1365,771 L535,771 L535,860" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><rect x="807.0" y="755" width="86" height="23" rx="5" fill="white"/><text x="850" y="771" font-size="14" fill="#5d6c80" font-weight="400" text-anchor="middle">人工确认后</text><path d="M690,904 L810,904" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1060,904 L1120,904" fill="none" stroke="#5d6c80" stroke-width="1.8" marker-end="url(#arr)"/><text x="48" y="1072" font-size="18" fill="#b45309" font-weight="600" text-anchor="start">失败与恢复</text><text x="48" y="1100" font-size="15" fill="#5d6c80" font-weight="400" text-anchor="start">处理技术失败会阻断审核；模型渠道故障停止后续请求。可恢复批次从已提交结果继续，执行结束不等于业务通过。</text></g></svg>