<svg xmlns="http://www.w3.org/2000/svg" width="1144" height="996" viewBox="0 0 1144 996" role="img" aria-labelledby="title desc">
<title id="title">规则库 Excel 解析优化方案</title><desc id="desc">程序保存完整原文，模型先建目录，再按关联对象生成配置。业务缺项保留；技术失败局部重试。全部组完成并通过全局核对后，才能生成待核对草稿。分组实现在配置中默认关闭。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#557083"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a84a38"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#18394a}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#425f70}.label,.role,.idx{font-size:14px;font-weight:700}.idx{fill:#4e6b78}.step{font-size:22px;font-weight:700}.role{fill:#385360}.detail,.body{font-size:16px}.notehead{font-size:19px;font-weight:700}.prog{fill:#edf6f5;stroke:#88b6ad}.model{fill:#eef3fb;stroke:#8da9cd}.paper{fill:#f6f8fa;stroke:#ced9df}.gap{fill:#fff8e8;stroke:#cbac6b}.err{fill:#fff2ee;stroke:#cb8d80}.arrow,.retry{fill:none;stroke:#557083;stroke-width:1.8;stroke-linejoin:round}.retry{stroke:#a84a38;stroke-dasharray:6 4}.cap{fill:#27685c;font-size:15px;font-weight:700}</style>
<rect width="1144" height="996" fill="#fff"/>
<text x="46" y="39" class="cap">分组试运行　／　默认关闭</text><text x="46" y="84" class="title">规则库 Excel 如何分组解析</text><text x="46" y="117" class="sub">保留整本原文，用目录找到相关行；每次模型调用只交付一组可以核对的结果。</text>
<path d="M46 140H1102" stroke="#c9d8dc"/><text x="46" y="170" class="label">解析主流程</text><text x="702" y="170" class="label">分组示例与异常处理</text>
<path class="arrow" d="M332 268v29" marker-end="url(#arr)"/>
<path class="arrow" d="M332 382v29" marker-end="url(#arr)"/>
<path class="arrow" d="M332 496v29" marker-end="url(#arr)"/>
<path class="arrow" d="M332 610v29" marker-end="url(#arr)"/>
<path class="arrow" d="M332 724v29" marker-end="url(#arr)"/>
<path class="arrow" d="M332 838v29" marker-end="url(#arr)"/>
<g><rect x="46" y="185" width="572" height="83" rx="6" class="prog"/><text x="66" y="216" class="idx">01</text><text x="108" y="218" class="step">保存原文与位置</text><text x="527" y="215" class="role">程序</text><text x="108" y="247" class="detail">保留表名、行列坐标、表头、合并区域和原始值。</text></g>
<g><rect x="46" y="299" width="572" height="83" rx="6" class="model"/><text x="66" y="330" class="idx">02</text><text x="108" y="332" class="step">第一轮：登记对象和引用</text><text x="527" y="329" class="role">模型</text><text x="108" y="361" class="detail">返回对象、原编号、出处和显式引用；歧义单独标记。</text></g>
<g><rect x="46" y="413" width="572" height="83" rx="6" class="prog"/><text x="66" y="444" class="idx">03</text><text x="108" y="446" class="step">把同一业务判断需要的原行放在一起</text><text x="527" y="443" class="role">程序</text><text x="108" y="475" class="detail">补齐跨表定义、表头和共享说明，预留回答空间。</text></g>
<g><rect x="46" y="527" width="572" height="83" rx="6" class="model"/><text x="66" y="558" class="idx">04</text><text x="108" y="560" class="step">第二轮：生成本组配置</text><text x="527" y="557" class="role">模型</text><text x="108" y="589" class="detail">只展开本组字段、规则或公式，引用真实来源。</text></g>
<g><rect x="46" y="641" width="572" height="83" rx="6" class="prog"/><text x="66" y="672" class="idx">05</text><text x="108" y="674" class="step">校验并保存每个已完成的组</text><text x="527" y="671" class="role">程序</text><text x="108" y="703" class="detail">检查结构、来源与绑定；保存检查点，再处理其余组。</text></g>
<g><rect x="46" y="755" width="572" height="83" rx="6" class="prog"/><text x="66" y="786" class="idx">06</text><text x="108" y="788" class="step">全部组完成后，核对整本目录</text><text x="527" y="785" class="role">程序</text><text x="108" y="817" class="detail">检查对象去向和跨组引用；不允许漏项静默消失。</text></g>
<g><rect x="46" y="869" width="572" height="83" rx="6" class="paper"/><text x="66" y="900" class="idx">07</text><text x="108" y="902" class="step">生成待核对的规则库草稿</text><text x="527" y="899" class="role">输出</text><text x="108" y="931" class="detail">列出原文缺项与出处，交给用户核对，再决定发布。</text></g>
<g><rect x="702" y="185" width="400" height="113" rx="5" class="paper"/><text x="723" y="216" class="notehead">第一轮怎么切？</text><text x="723" y="245" class="body">小工作簿整本建目录；超预算再分块。</text><text x="723" y="268" class="body">按业务行组切，携带表头和合并区上下文。</text></g>
<g><rect x="702" y="355" width="400" height="125" rx="5" class="paper"/><text x="723" y="386" class="notehead">跨表示例：两份协议的金额比较</text><text x="723" y="415" class="body">同组输入：规则原行、主合同金额定义、</text><text x="723" y="438" class="body">补充协议金额定义，以及原文中的币种说明。</text><text x="723" y="461" class="body">同名字段保留各自材料归属。</text></g>
<g><rect x="702" y="500" width="400" height="121" rx="5" class="gap"/><text x="723" y="531" class="notehead">原文有歧义，或确实缺项</text><text x="723" y="560" class="body">先补读相关原行。仍不能确定，就记录</text><text x="723" y="583" class="body">未绑定项与出处，随本组结果参加校验。</text><text x="723" y="606" class="body">缺失值与引用目标都不猜填。</text></g>
<g><rect x="702" y="646" width="400" height="129" rx="5" class="err"/><text x="723" y="677" class="notehead">模型截断、结构错误或引用不合法</text><text x="723" y="706" class="body">只修正失败组，必要时缩小该组再生成。</text><text x="723" y="729" class="body">达到重试上限则暂停，保留成功组；</text><text x="723" y="752" class="body">技术失败不能登记为原文缺项。</text></g>
<g><rect x="702" y="802" width="400" height="100" rx="5" class="paper"/><text x="723" y="833" class="notehead">全局核对发现遗漏或冲突</text><text x="723" y="862" class="body">回到关联组补读、修正并重新校验；</text><text x="723" y="885" class="body">仍有技术错误时不生成完整草稿。</text></g>
<path class="arrow" d="M618 446H700" marker-end="url(#arr)"/><path class="arrow" d="M618 566H700" marker-end="url(#arr)"/><path class="arrow" d="M618 686H700" marker-end="url(#arr)"/><path class="retry" d="M702 737H657V596H620" marker-end="url(#red)"/><path class="arrow" d="M618 810H700" marker-end="url(#arr)"/>
</svg>
